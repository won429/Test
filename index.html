<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>대경선 지하철 현황 실시간 트래커</title><!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- 폰트 및 아이콘 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" type="text/css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 외부 스타일시트 연결 -->
<link rel="stylesheet" href="style.css">
</head><body class="w-full h-[100dvh] flex justify-center items-center overflow-hidden"><!-- 스마트폰 형태의 메인 래퍼 -->
<div id="app" class="w-full h-full max-w-[430px] bg-white relative flex flex-col overflow-hidden sm:border-x border-black/5 sm:shadow-2xl">
    
    <!-- 1. 홈 화면 -->
    <main id="home-screen" class="hidden absolute inset-0 z-[25] bg-white flex-col overflow-y-auto hide-scrollbar pb-24">
        <header class="flex-none pt-safe bg-white/90 backdrop-blur-md z-40 sticky top-0">
            <div class="px-5 pb-1 flex justify-between items-center">
                <h2 class="text-[18px] font-extrabold text-[#111827] tracking-tight">대구권 대경선 지하철역</h2>
                <!-- 즐겨찾기 버튼 추가 -->
                <button id="favorite-toggle-btn" onclick="toggleFavorite()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-400 hover:text-yellow-400 transition-colors">
                    <i id="favorite-icon" class="fa-regular fa-star text-[14px]"></i>
                </button>
            </div>
        </header>

        <div class="px-5 pt-3 space-y-6">
            <div>
                <!-- 지역 선택 탭 -->
                <div class="flex gap-1.5 overflow-x-auto hide-scrollbar mb-2 pb-1">
                    <button onclick="showPreparingPopup('수도권')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-400 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">수도권</button>
                    <button id="btn-region-busan" onclick="switchRegion('busan')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-500 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">부산권</button>
                    <button id="btn-region-daegu" onclick="switchRegion('daegu')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-[#0054A6] text-white shadow-[0_2px_8px_rgba(0,84,166,0.3)] shrink-0 border border-[#0054A6] transition-all">대구권</button>
                    <button id="btn-region-daejeon" onclick="switchRegion('daejeon')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-500 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">대전</button>
                    <button id="btn-region-gwangju" onclick="switchRegion('gwangju')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-500 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">광주</button>
                </div>

                <!-- 노선 선택 탭 -->
                <div id="line-tabs-daegu" class="flex gap-1.5 overflow-x-auto hide-scrollbar mb-4 pb-1">
                    <button id="btn-line-daegyeong" onclick="switchLine('daegyeong')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-[#0054A6] text-white shadow-[0_2px_8px_rgba(0,84,166,0.3)] shrink-0 border border-[#0054A6] transition-all">대경선</button>
                    <button id="btn-line-1" onclick="switchLine('line1')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-500 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">1호선</button>
                    <button onclick="showPreparingPopup('2호선')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-400 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">2호선</button>
                    <button onclick="showPreparingPopup('3호선')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-400 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">3호선</button>
                </div>
                <div id="line-tabs-daejeon" class="hidden gap-1.5 overflow-x-auto hide-scrollbar mb-4 pb-1">
                    <button id="btn-line-daejeon1" onclick="switchLine('daejeon_line1')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-[#007448] text-white shadow-[0_2px_8px_rgba(0,116,72,0.3)] shrink-0 border border-[#007448] transition-all">1호선</button>
                </div>
                <div id="line-tabs-busan" class="hidden gap-1.5 overflow-x-auto hide-scrollbar mb-4 pb-1">
                    <button id="btn-line-busan1" onclick="switchLine('busan_line1')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-[#F06A00] text-white shadow-[0_2px_8px_rgba(240,106,0,0.3)] shrink-0 border border-[#F06A00] transition-all">1호선</button>
                    <button id="btn-line-busan2" onclick="switchLine('busan_line2')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-500 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">2호선</button>
                    <button id="btn-line-busan3" onclick="switchLine('busan_line3')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-500 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">3호선</button>
                    <button id="btn-line-busan4" onclick="switchLine('busan_line4')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-500 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">4호선</button>
                    <button id="btn-line-bglrt" onclick="switchLine('busan_bglrt')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-500 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">부산김해</button>
                    <button id="btn-line-donghae" onclick="switchLine('busan_donghae')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-500 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">동해선</button>
                    <button onclick="showPreparingPopup('양산선')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-gray-100 text-gray-400 shrink-0 border border-black/5 cursor-pointer hover:bg-gray-200 transition-all">양산선</button>
                </div>
                <div id="line-tabs-gwangju" class="hidden gap-1.5 overflow-x-auto hide-scrollbar mb-4 pb-1">
                    <button id="btn-line-gwangju1" onclick="switchLine('gwangju_line1')" class="px-3 py-1 rounded-full text-[11px] font-bold bg-[#0090D2] text-white shadow-[0_2px_8px_rgba(0,144,210,0.3)] shrink-0 border border-[#0090D2] transition-all">1호선</button>
                </div>

                <!-- 코레일 스타일 역명판 -->
                <div onclick="openStationSelector()" class="relative w-full flex items-center justify-center cursor-pointer active:scale-95 transition-transform">
                    <div class="station-plate-base w-full">
                        <div class="flex-1 text-left pl-2 pr-8 sm:pr-12 overflow-hidden">
                            <div id="home-prev-station-container" class="opacity-0 transition-opacity">
                                <span id="home-prev-station" class="text-white text-[14px] font-bold tracking-tight block truncate"></span>
                            </div>
                        </div>
                        <div class="flex-1 text-right pr-2 pl-8 sm:pl-12 overflow-hidden">
                            <div id="home-next-station-container" class="opacity-100 transition-opacity">
                                <span id="home-next-station" class="text-white text-[14px] font-bold tracking-tight block truncate">사곡 &gt;</span>
                            </div>
                        </div>
                    </div>
                    <div class="station-plate-pill">
                        <div class="metro-logo-circle shrink-0">대</div>
                        <span id="home-station-name" class="text-lg font-black text-black whitespace-nowrap">구미</span>
                    </div>
                </div>
            </div>

            <!-- 도착 정보 섹션 -->
            <div class="flex flex-col gap-3.5">
                <div class="flex justify-between items-end mb-1 px-1">
                    <h3 class="text-lg font-bold text-[#111827] tracking-tight">도착 정보</h3>
                    <div class="flex items-center gap-2">
                        <span id="data-status-home" class="hidden text-[10px] font-bold text-red-400 bg-red-500/10 px-2 py-1 rounded-md border border-red-500/20 animate-pulse">임의 데이터 사용중</span>
                        <span id="home-current-time" class="text-xs font-bold text-gray-500 bg-black/5 px-2 py-1 rounded-md">오후 5:35</span>
                        <button onclick="renderHomeArrivalInfo()" class="w-6 h-6 flex items-center justify-center text-gray-500 hover:text-black transition-colors"><i class="fa-solid fa-rotate-right"></i></button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div class="list-card p-3.5 flex flex-col min-h-[110px] relative overflow-hidden text-center">
                        <span id="home-up-dir-label" class="text-[12px] font-bold text-gray-500 mb-2.5">구미 방면</span>
                        <div id="home-up-info" class="flex-1 flex flex-col justify-center items-center gap-1.5"></div>
                    </div>
                    <div class="list-card p-3.5 flex flex-col min-h-[110px] relative overflow-hidden text-center">
                        <span id="home-down-dir-label" class="text-[12px] font-bold text-gray-500 mb-2.5">경산 방면</span>
                        <div id="home-down-info" class="flex-1 flex flex-col justify-center gap-1.5"></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5 mt-2">
                    <button onclick="openHomeTimetable()" class="bg-gray-100 hover:bg-gray-200 border border-black/5 rounded-[16px] py-3 flex items-center justify-center gap-1.5 active:scale-[0.98] transition-all">
                        <i id="btn-icon-1" class="fa-regular fa-clock text-[#0054A6] text-[15px]"></i>
                        <span class="text-[12px] font-bold text-[#111827]">전체 시간표 <i class="fa-solid fa-chevron-down text-[8px] ml-0.5 text-gray-400"></i></span>
                    </button>
                    <button onclick="openHomeTimetable()" class="bg-gray-100 hover:bg-gray-200 border border-black/5 rounded-[16px] py-3 flex items-center justify-center gap-1.5 active:scale-[0.98] transition-all">
                        <i id="btn-icon-2" class="fa-solid fa-train-tram text-[#0054A6] text-[15px]"></i>
                        <span class="text-[12px] font-bold text-[#111827]">첫차·막차 <i class="fa-solid fa-chevron-down text-[8px] ml-0.5 text-gray-400"></i></span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 2. 상단 헤더 & 트래커 UI -->
    <header id="main-header" class="hidden absolute top-0 left-0 w-full z-20 bg-white/90 backdrop-blur-md flex flex-col pt-safe pb-1.5 shadow-sm text-[#111827] transition-all">
        <div class="px-4 pt-2 flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
                <h1 id="line-header-title" class="text-[17px] font-extrabold tracking-tight text-[#111827] drop-shadow-sm">대구권 대경선 지하철 현황</h1>
                <select id="direction-toggle" class="bg-gray-100 text-gray-700 text-[11px] font-bold px-2 py-1 rounded-md outline-none cursor-pointer border border-black/5 shadow-sm transition-all focus:ring-2 focus:ring-[#0054A6]/50 appearance-none pr-5 relative" style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2210%22%20height%3D%2210%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%236B7280%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 4px center;">
                    <option value="up" class="text-gray-900">상행 (구미 방면)</option>
                    <option value="down" class="text-gray-900">하행 (경산 방면)</option>
                </select>
            </div>
            <div class="flex flex-col items-end gap-1 shrink-0">
                <div class="flex items-center gap-1.5 bg-black/5 px-2.5 py-1.5 rounded-full border border-black/5">
                    <i class="fa-regular fa-clock text-[10px] text-gray-500"></i>
                    <span id="day-type-display" class="text-[10px] text-gray-600 font-bold">평일</span>
                    <span class="text-gray-400 text-[10px] leading-none">·</span>
                    <span id="data-status-display" class="text-[10px] text-[#0054A6] font-bold">실시간</span>
                    <span id="clock-display" class="text-[10px] text-gray-600 font-mono tracking-tighter ml-0.5">00:00:00</span>
                </div>
                <div class="flex items-center gap-1.5 text-[10px] font-medium text-gray-500 mr-1">
                    <span>상행 <b id="count-up" class="font-extrabold text-[#0054A6]">0</b></span>
                    <span class="text-gray-400 text-[8px] leading-none">|</span>
                    <span>하행 <b id="count-down" class="font-extrabold text-[#5998D6]">0</b></span>
                </div>
            </div>
        </div>
        <!-- 열차 버튼 리스트 영역 -->
        <div id="train-list" class="flex gap-2 overflow-x-auto px-4 pb-1 hide-scrollbar"></div>
    </header>

    <!-- 3. 트래커 맵 스크롤 뷰 -->
    <main id="scroll-container" class="hidden flex-1 w-full h-full overflow-y-auto overflow-x-hidden bg-white scroll-smooth relative pt-[80px] pb-32">
        <div id="svg-wrapper" class="relative w-full h-[1500px]">
            <div id="line-view" class="absolute top-0 left-0 w-full transition-opacity duration-500 opacity-0 z-0 pointer-events-none">
                <svg id="line-svg" viewBox="0 0 400 1300" class="w-full h-[1300px]">
                    <!-- 노선 상단 표시 -->
                    <g id="svg-down-top">
                        <rect x="94" y="24" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#5998D6" stroke-width="2" class="transition-colors duration-300" />
                        <text x="120" y="40.5" text-anchor="middle" fill="#5998D6" class="text-[13px] font-extrabold tracking-widest transition-colors duration-300">하행</text>
                    </g>
                    <g id="svg-up-top">
                        <rect x="254" y="24" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#0054A6" stroke-width="2" class="transition-colors duration-300" />
                        <text x="280" y="40.5" text-anchor="middle" fill="#0054A6" class="text-[13px] font-extrabold tracking-widest transition-colors duration-300">상행</text>
                    </g>

                    <path id="line-path-down-bg" d="M 120 60 L 120 1200" fill="none" stroke="#5998D6" stroke-width="6" stroke-linecap="round" opacity="0.3" class="transition-colors duration-300" />
                    <path id="line-path-up-bg" d="M 280 60 L 280 1200" fill="none" stroke="#0054A6" stroke-width="6" stroke-linecap="round" opacity="0.3" class="transition-colors duration-300" />
                    <path id="line-path-down" d="M 120 60 L 120 1200" fill="none" stroke="transparent" stroke-width="8" />
                    <path id="line-path-up" d="M 280 60 L 280 1200" fill="none" stroke="transparent" stroke-width="8" />
                    
                    <!-- 노선 하단 표시 -->
                    <g id="svg-down-bottom" transform="translate(0,0)" class="transition-transform duration-300">
                        <rect x="94" y="1219" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#5998D6" stroke-width="2" class="transition-colors duration-300" />
                        <text x="120" y="1235.5" text-anchor="middle" fill="#5998D6" class="text-[13px] font-extrabold tracking-widest transition-colors duration-300">하행</text>
                    </g>
                    <g id="svg-up-bottom" transform="translate(0,0)" class="transition-transform duration-300">
                        <rect x="254" y="1219" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#0054A6" stroke-width="2" class="transition-colors duration-300" />
                        <text x="280" y="1235.5" text-anchor="middle" fill="#0054A6" class="text-[13px] font-extrabold tracking-widest transition-colors duration-300">상행</text>
                    </g>

                    <g id="line-stations"></g>
                    <g id="line-trains-down"></g>
                    <g id="line-trains-up"></g>
                </svg>
            </div>
        </div>
    </main>

    <button id="auto-scroll-btn" class="hidden absolute bottom-[200px] left-1/2 -translate-x-1/2 bg-white border border-black/10 px-3.5 py-1.5 rounded-full shadow-xl text-[11px] font-bold text-gray-700 flex items-center gap-1.5 z-40 transition-transform active:scale-95">
        <i class="fa-solid fa-location-crosshairs text-[#0054A6] text-[13px]" id="scroll-cross-icon"></i> 선택한 열차 따라가기
    </button>

    <div id="floating-panel" class="hidden absolute bottom-[100px] left-0 right-0 px-4 z-[90] min-h-[72px] transition-all duration-300"></div>

    <!-- 4. 하단 네비게이션 -->
    <nav id="bottom-nav" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-[100] w-[75%] max-w-[240px] px-1.5 touch-pan-x select-none">
        <div class="flex items-center justify-between bg-white/90 backdrop-blur-[12px] backdrop-saturate-[180%] shadow-[0_8px_32px_0_rgba(0,0,0,0.1)] border border-black/10 rounded-full p-1 gap-0.5 relative transition-all duration-300">
            <div id="nav-indicator" class="absolute top-1 bottom-1 bg-white shadow-sm rounded-full border border-black/5 z-0 nav-transition" style="left: 4px; width: 66px;"></div>
            
            <button id="tab-back" onclick="window.location.href='https://won429.github.io/enjoysite/'" class="relative py-1.5 flex-1 rounded-full group z-10 active:scale-95 transition-transform">
                <div class="flex flex-col items-center gap-[2px] pointer-events-none">
                    <i class="fa-solid fa-arrow-left text-[15px] text-gray-400 group-hover:text-black transition-colors"></i>
                    <span class="text-[10px] font-medium text-gray-400 group-hover:text-black whitespace-nowrap transition-colors">뒤로가기</span>
                </div>
            </button>
            <button id="tab-home" class="relative py-1.5 flex-1 rounded-full group z-10 active:scale-95 transition-transform">
                <div class="flex flex-col items-center gap-[2px] pointer-events-none">
                    <i class="fa-solid fa-house text-[15px] text-black drop-shadow-sm group-hover:text-black transition-colors"></i>
                    <span class="text-[10px] text-black font-bold group-hover:text-black whitespace-nowrap transition-colors">홈</span>
                </div>
            </button>
            <button id="tab-line" class="relative py-1.5 flex-1 rounded-full group z-10 active:scale-95 transition-transform">
                <div class="flex flex-col items-center gap-[2px] pointer-events-none">
                    <i class="fa-solid fa-route text-[15px] text-gray-400 transition-colors"></i>
                    <span class="text-[10px] font-medium text-gray-400 whitespace-nowrap transition-colors">노선</span>
                </div>
            </button>
        </div>
    </nav>

    <!-- 모달들 -->
    <div id="timetable-modal" class="hidden absolute inset-0 z-[150] flex flex-col justify-end bg-black/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full h-[75%] rounded-t-[32px] shadow-[0_-20px_40px_rgba(0,0,0,0.1)] flex flex-col animate-in border-t border-black/5">
            <div class="flex flex-col items-center pt-4 pb-2 border-b border-black/5 shrink-0 relative">
                <div class="w-10 h-1 bg-gray-200 rounded-full mb-3"></div>
                <h2 id="modal-title" class="text-[18px] font-extrabold text-[#111827] tracking-tight">역 시간표</h2>
                <div id="modal-subtitle" class="mt-1 flex w-full justify-center"></div>
                <button id="close-modal-btn" class="absolute right-5 top-4 w-7 h-7 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 hover:text-black transition-colors">
                    <i class="fa-solid fa-xmark text-[12px]"></i>
                </button>
            </div>
            <div id="modal-content" class="flex-1 overflow-y-auto px-4 py-2 pb-10 hide-scrollbar"></div>
        </div>
    </div>

    <div id="station-selector-modal" class="hidden absolute inset-0 z-[150] flex flex-col justify-end bg-black/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full h-[60%] rounded-t-[32px] shadow-[0_-20px_40px_rgba(0,0,0,0.1)] flex flex-col animate-in border-t border-black/5">
            <div class="flex flex-col items-center pt-4 pb-3 border-b border-black/5 shrink-0 relative">
                <div class="w-10 h-1 bg-gray-200 rounded-full mb-3"></div>
                <h2 class="text-[18px] font-extrabold text-[#111827] tracking-tight">역 선택</h2>
                <button onclick="closeStationSelector()" class="absolute right-5 top-4 w-7 h-7 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 hover:text-black transition-colors">
                    <i class="fa-solid fa-xmark text-[12px]"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto px-4 py-3 pb-10 space-y-1.5 hide-scrollbar" id="selector-list-container"></div>
        </div>
    </div>

    <!-- 준비중 팝업 -->
    <div id="preparing-modal" class="hidden absolute inset-0 z-[200] flex items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white w-[75%] max-w-[280px] rounded-[24px] shadow-2xl flex flex-col items-center p-6 text-center transform scale-95 transition-transform duration-300">
            <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mb-3">
                <i class="fa-solid fa-person-digging text-[20px] text-[#0054A6]" id="preparing-icon"></i>
            </div>
            <h3 class="text-[17px] font-extrabold text-[#111827] mb-1.5 tracking-tight">서비스 준비 중</h3>
            <p id="preparing-text" class="text-[13px] font-medium text-gray-500 mb-5 leading-relaxed">해당 지역 또는 노선은<br>현재 준비 중입니다.</p>
