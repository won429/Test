        /* 핑 & 펄스 애니메이션 설정 */
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
        .animate-ping { animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes pulse { 50% { opacity: .5; } }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes bounce { 
            0%, 100% { transform: translateY(-25%) translateX(-50%); animation-timing-function: cubic-bezier(0.8,0,1,1); } 
            50% { transform: none translateX(-50%); animation-timing-function: cubic-bezier(0,0,0.2,1); } 
        }
        .animate-bounce { animation: bounce 1s infinite; }
        
        /* 모달 슬라이드 애니메이션 */
        @keyframes slide-in-from-bottom { 0% { transform: translateY(100%); } 100% { transform: translateY(0); } }
        .animate-in { animation: slide-in-from-bottom 0.3s ease-out forwards; }
    </style>

        // 💡 깃허브에 올린 CSV 파일명 매핑
        const FILE_URLS = {
            weekday_up: 'dae_up.csv',     // 평일 상행 (파일이 없을 경우 대비해 위의 CSV_WEEKDAY_UP 유지)
            weekday_down: 'dae_down.csv', // 평일 하행 (사용자 요청)
            weekend_up: 'daew_up.csv',    // 주말/휴일 상행 (사용자 요청)
            weekend_down: 'daew_down.csv' // 주말/휴일 하행 (사용자 요청 수정)
        };

        let activeTab = 'route';
        let isAutoScroll = true;
        let selectedTrainId = null;
        let selectedStation = null;
        let currentSec = 0;
        let routeLength = 0;
        let mapLength = 0;
        
        let currentDirection = 'up'; // 'up' (상행) | 'down' (하행)
        let currentDayType = 'weekday'; // 'weekday' (평일) | 'weekend' (주말) | 'holiday' (공휴일)
        
        // 상하행 데이터를 모두 담아둘 변수
        let parsedTrainsUp = [];
        let parsedTrainsDown = [];
        let parsedTrains = [];

        // 날짜/시간 유틸리티
        const getDayType = (dateObj) => {
            const day = dateObj.getDay();
            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const ymd = `${yyyy}-${mm}-${dd}`;
            
            if (KOR_HOLIDAYS.includes(ymd)) return 'holiday';
            if (day === 0 || day === 6) return 'weekend';
            return 'weekday';
        };

        const timeToSeconds = (timeStr) => {
            if (!timeStr) return 0;
            let [h, m, s] = timeStr.split(':').map(Number);
            if (h < 4) h += 24; 
            return h * 3600 + m * 60 + s;
        };

        const secondsToTime = (totalSeconds) => {
            const h = Math.floor(totalSeconds / 3600) % 24; 
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = Math.floor(totalSeconds % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        // --- 2. CSV 견고한 비동기 파싱 (GitHub 연동) --- //
        const loadTimetable = async () => {
            let targetUpUrl = '', targetDownUrl = '';
            if (currentDayType === 'weekday') {
                targetUpUrl = FILE_URLS.weekday_up;
                targetDownUrl = FILE_URLS.weekday_down;
            } else {
                targetUpUrl = FILE_URLS.weekend_up;
                targetDownUrl = FILE_URLS.weekend_down;
            }

            try {
                // 상하행 CSV를 GitHub 등 호스팅 서버에서 실시간 병렬 요청
                const [upRes, downRes] = await Promise.all([
                    fetch(targetUpUrl).catch(() => null),
                    fetch(targetDownUrl).catch(() => null)
                ]);

                // 응답 성공 시 텍스트 파싱. 파일이 없거나 오류일 경우:
                // 상행 평일은 앱이 터지지 않도록 기존 하드코딩 데이터를 폴백(Fallback)으로 사용
                const upCsv = (upRes && upRes.ok) ? await upRes.text() : (currentDayType === 'weekday' ? CSV_WEEKDAY_UP : '');
                const downCsv = (downRes && downRes.ok) ? await downRes.text() : '';

                const parseCsv = (csvStr) => {
                    if (!csvStr) return [];
                    const lines = csvStr.trim().split(/\r?\n/);
                    if (lines.length === 0) return [];
                    const headers = lines[0].split(',');
                    const trainIds = headers.slice(1);
                    const trains = trainIds.map(id => ({ id: id ? id.trim() : '', schedule: [] }));

                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const row = lines[i].split(',');
                        const stationName = row[0] ? row[0].trim() : '';
                        const stationData = STATIONS[stationName];
                        if (!stationData) continue;

                        for (let j = 1; j < row.length; j++) {
                            if (j - 1 >= trains.length) continue; 
                            const timeStr = row[j] ? row[j].trim() : '';
                            if (timeStr) {
                                trains[j-1].schedule.push({
                                    name: stationName,
                                    time: timeStr,
                                    sec: timeToSeconds(timeStr),
                                    progress: stationData.progress
                                });
                            }
                        }
                    }
                    trains.forEach(t => t.schedule.sort((a, b) => a.sec - b.sec));
                    return trains.filter(t => t.id && t.schedule.length >= 2);
                };

                // 상하행 모두 파싱하여 캐싱 (노선 탭에서 동시 사용)
                parsedTrainsUp = parseCsv(upCsv);
                parsedTrainsDown = parseCsv(downCsv);

                // 현재 선택된 방향의 데이터를 메인 배열로 지정
                parsedTrains = currentDirection === 'up' ? parsedTrainsUp : parsedTrainsDown;
                
                selectedTrainId = null;
                selectedStation = null;
            } catch (error) {
                console.error("시간표 데이터를 불러오는데 실패했습니다.", error);
            }
        };

        // --- 3. DOM 요소 연결 및 초기화 --- //
        const dom = {
            clock: document.getElementById('clock-display'),
            dayTypeDisplay: document.getElementById('day-type-display'),
            directionToggle: document.getElementById('direction-toggle'),
            trainList: document.getElementById('train-list'),
            scrollContainer: document.getElementById('scroll-container'),
            
            // View 컨테이너들
            lineView: document.getElementById('line-view'),
            routeView: document.getElementById('route-view'),
            mapView: document.getElementById('map-view'),
            
            // Paths
            linePathDown: document.getElementById('line-path-down'),
            linePathUp: document.getElementById('line-path-up'),
            routePath: document.getElementById('route-path'),
            mapPath: document.getElementById('map-path'),
            
            // Station Groups
            lineStations: document.getElementById('line-stations'),
            routeStations: document.getElementById('route-stations'),
            mapStations: document.getElementById('map-stations'),
            
            // Train Groups
            lineTrainsDown: document.getElementById('line-trains-down'),
            lineTrainsUp: document.getElementById('line-trains-up'),
            routeTrains: document.getElementById('route-trains'),
            mapTrains: document.getElementById('map-trains'),
            
            autoScrollBtn: document.getElementById('auto-scroll-btn'),
            floatingPanel: document.getElementById('floating-panel'),
            
            // Tabs
            tabLine: document.getElementById('tab-line'),
            tabRoute: document.getElementById('tab-route'),
            tabMap: document.getElementById('tab-map'),
            
            // Modal
            timetableModal: document.getElementById('timetable-modal'),
            modalTitle: document.getElementById('modal-title'),
            modalSubtitle: document.getElementById('modal-subtitle'),
            modalContent: document.getElementById('modal-content'),
            closeModalBtn: document.getElementById('close-modal-btn')
        };

        // 이벤트 리스너 세팅
        dom.directionToggle.addEventListener('change', async (e) => {
            currentDirection = e.target.value;
            await loadTimetable();
            isAutoScroll = true;
            render();
        });

        const stopAutoScroll = () => { if(isAutoScroll) { isAutoScroll = false; render(); } };
        dom.scrollContainer.addEventListener('touchstart', stopAutoScroll, {passive: true});
        dom.scrollContainer.addEventListener('wheel', stopAutoScroll, {passive: true});
        dom.scrollContainer.addEventListener('mousedown', stopAutoScroll);

        dom.autoScrollBtn.addEventListener('click', () => { isAutoScroll = true; render(); });
        dom.closeModalBtn.addEventListener('click', () => { dom.timetableModal.classList.add('hidden'); });

        // 하단 탭 스위치
        dom.tabLine.addEventListener('click', () => { 
            activeTab = 'line'; selectedStation = null; isAutoScroll = false; 
            dom.directionToggle.classList.add('hidden'); // 노선 탭에서 상하행 선택기 숨김
            
            dom.lineView.classList.replace('opacity-0', 'opacity-100');
            dom.lineView.classList.remove('pointer-events-none');
            dom.routeView.classList.replace('opacity-100', 'opacity-0');
            dom.routeView.classList.add('pointer-events-none');
            dom.mapView.classList.replace('opacity-100', 'opacity-0');
            dom.mapView.classList.add('pointer-events-none');
            
            dom.tabLine.classList.replace('text-gray-400', 'text-[#0052FF]');
            dom.tabRoute.classList.replace('text-[#0052FF]', 'text-gray-400');
            dom.tabMap.classList.replace('text-[#0052FF]', 'text-gray-400');
            render(); 
        });

        dom.tabRoute.addEventListener('click', () => { 
            activeTab = 'route'; selectedStation = null; isAutoScroll = true; 
            dom.directionToggle.classList.remove('hidden'); // 다시 복구
            
            dom.routeView.classList.replace('opacity-0', 'opacity-100');
            dom.routeView.classList.remove('pointer-events-none');
            dom.lineView.classList.replace('opacity-100', 'opacity-0');
            dom.lineView.classList.add('pointer-events-none');
            dom.mapView.classList.replace('opacity-100', 'opacity-0');
            dom.mapView.classList.add('pointer-events-none');
            
            dom.tabRoute.classList.replace('text-gray-400', 'text-[#0052FF]');
            dom.tabLine.classList.replace('text-[#0052FF]', 'text-gray-400');
            dom.tabMap.classList.replace('text-[#0052FF]', 'text-gray-400');
            render(); 
        });

        dom.tabMap.addEventListener('click', () => { 
            activeTab = 'map'; selectedStation = null; isAutoScroll = true; 
            dom.directionToggle.classList.remove('hidden'); // 다시 복구
            
            dom.mapView.classList.replace('opacity-0', 'opacity-100');
            dom.mapView.classList.remove('pointer-events-none');
            dom.routeView.classList.replace('opacity-100', 'opacity-0');
            dom.routeView.classList.add('pointer-events-none');
            dom.lineView.classList.replace('opacity-100', 'opacity-0');
            dom.lineView.classList.add('pointer-events-none');
            
            dom.tabMap.classList.replace('text-gray-400', 'text-[#0052FF]');
            dom.tabRoute.classList.replace('text-[#0052FF]', 'text-gray-400');
            dom.tabLine.classList.replace('text-[#0052FF]', 'text-gray-400');
            render(); 
        });

        window.handleStationClick = (stationName) => {
            selectedStation = stationName;
            isAutoScroll = false;
            render();
        };

        window.handleTrainClick = (trainId) => {
            selectedTrainId = trainId;
            isAutoScroll = true;
            selectedStation = null;
            render();
        };

        window.openModal = () => { dom.timetableModal.classList.remove('hidden'); };

        // --- 4. 렌더링 함수들 --- //

        function drawStaticStations() {
            let lineHTML = '', routeHTML = '', mapHTML = '';
            for (const stationName in STATIONS) {
                const s = STATIONS[stationName];
                const isSel = selectedStation === stationName;
                
                // 신규: 직선 노선도 Station (중앙 배치 후 좌우로 선긋기)
                const lineY = 100 + 1100 * s.progress;
                lineHTML += `
                    <g transform="translate(200, ${lineY})" onclick="handleStationClick('${stationName}')" class="cursor-pointer">
                        <path d="M -80 0 L 80 0" stroke="#E5E8EB" stroke-width="2" stroke-dasharray="4" />
                        <rect x="-100" y="-15" width="200" height="30" fill="transparent" />
                        <circle r="${isSel ? '8' : '6'}" fill="#FFFFFF" stroke="${isSel ? THEME_COLOR : '#A0ABC0'}" stroke-width="${isSel ? '4' : '3'}" class="transition-all" />
                        <text x="0" y="-12" text-anchor="middle" class="text-[12px] font-bold ${isSel ? 'text-[#0052FF]' : 'text-gray-700'}">${stationName}</text>
                        ${s.ktx ? `<text x="0" y="14" text-anchor="middle" fill="${THEME_COLOR}" class="text-[8px] font-black italic opacity-80">KTX</text>` : ''}
                    </g>
                `;

                let rPt = {x:0, y:0};
                if(routeLength > 0) rPt = dom.routePath.getPointAtLength(routeLength * s.progress);
                
                routeHTML += `
                    <g transform="translate(${rPt.x}, ${rPt.y})" onclick="handleStationClick('${stationName}')" class="cursor-pointer">
                        <circle r="20" fill="transparent" />
                        <circle r="${isSel ? '8' : '6'}" fill="#FFFFFF" stroke="${isSel ? THEME_COLOR : '#A0ABC0'}" stroke-width="${isSel ? '4' : '3'}" class="transition-all" />
                        <text x="${s.xOff}" y="${s.yOff}" text-anchor="${s.align}" class="text-[13px] font-extrabold tracking-tight ${isSel ? 'text-[#0052FF]' : 'text-gray-800'}">${stationName}</text>
                        ${s.ktx ? `<text x="${s.xOff}" y="${s.yOff + 13}" text-anchor="${s.align}" fill="${THEME_COLOR}" class="text-[8px] font-black italic opacity-80">KTX</text>` : ''}
                    </g>
                `;

                let mPt = {x:0, y:0};
                if(mapLength > 0) mPt = dom.mapPath.getPointAtLength(mapLength * s.progress);
                mapHTML += `
                    <g transform="translate(${mPt.x}, ${mPt.y})" onclick="handleStationClick('${stationName}')" class="cursor-pointer">
                        <circle r="20" fill="transparent" />
                        <circle r="${isSel ? '8' : '6'}" fill="#FFFFFF" stroke="${isSel ? THEME_COLOR : '#A0ABC0'}" stroke-width="${isSel ? '4' : '3'}" class="transition-all" />
                        <rect x="-24" y="-30" width="48" height="20" rx="10" fill="white" opacity="0.95" class="shadow-sm" />
                        <text x="0" y="-16" text-anchor="middle" class="text-[11px] font-bold ${isSel ? 'text-[#0052FF]' : 'text-gray-700'}">${stationName}</text>
                    </g>
                `;
            }
            dom.lineStations.innerHTML = lineHTML;
            dom.routeStations.innerHTML = routeHTML;
            dom.mapStations.innerHTML = mapHTML;
        }

        function updateTrainsSVG(layer, trains) {
            const currentIds = trains.map(t => t.id);
            Array.from(layer.children).forEach(child => {
                if (!currentIds.includes(child.dataset.id)) child.remove();
            });

            trains.forEach(t => {
                let g = layer.querySelector(`g[data-id="${t.id}"]`);
                const isSelected = t.id === selectedTrainId;
                if (!g) {
                    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    g.dataset.id = t.id;
                    layer.appendChild(g);
                }
                
                g.setAttribute("transform", `translate(${t.point.x}, ${t.point.y}) rotate(${t.angle})`);
                
                const stateStr = `${isSelected}-${t.isStopped}-${t.isWaiting}`;
                if (g.dataset.state !== stateStr) {
                    g.innerHTML = `
                        ${isSelected && !t.isStopped && !t.isWaiting ? `<circle r="26" fill="${THEME_COLOR}" opacity="0.2" class="animate-ping" />` : ''}
                        ${isSelected && (t.isStopped || t.isWaiting) ? `<circle r="22" fill="${THEME_COLOR}" opacity="0.15" />` : ''}
                        <rect x="-16" y="-7" width="32" height="14" rx="3" fill="${isSelected ? THEME_COLOR : '#6B7280'}" stroke="#FFFFFF" stroke-width="2" class="shadow-lg" />
                        <rect x="-10" y="-4" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9" />
                        <rect x="-1" y="-4" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9" />
                        <rect x="8" y="-4" width="4" height="8" rx="1" fill="#FFFFFF" opacity="0.9" />
                        <path d="M 12 -7 L 16 -4 L 16 4 L 12 7 Z" fill="${isSelected ? THEME_COLOR : '#6B7280'}" />
                        <circle cx="15" cy="-3" r="1.5" fill="${isSelected ? '#FFE600' : '#FFFFFF'}" />
                        <circle cx="15" cy="3" r="1.5" fill="${isSelected ? '#FFE600' : '#FFFFFF'}" />
                        ${t.isWaiting ? `<text x="0" y="-18" text-anchor="middle" fill="${THEME_COLOR}" class="text-[10px] font-bold animate-pulse" transform="rotate(${-t.angle})">첫차 대기중</text>` : ''}
                    `;
                    g.dataset.state = stateStr;
                }
            });
        }

        // 공통: 활성화된 열차 및 위치/상태 계산기
        const getActiveTrainDetails = (trainList, dirStr) => {
            let active = trainList.map(train => {
                const firstStop = train.schedule[0];
                const lastStop = train.schedule[train.schedule.length - 1];
                if (currentSec < firstStop.sec || currentSec > lastStop.sec + STOP_DURATION) return null;

                let currentIdx = 0;
                for (let i = 0; i < train.schedule.length; i++) {
                    if (currentSec >= train.schedule[i].sec) currentIdx = i; else break;
                }

                const currentStation = train.schedule[currentIdx];
                const nextStation = train.schedule[currentIdx + 1] || currentStation;
                let overallProgress = currentStation.progress, isStopped = false, timeRemaining = 0;

                if (currentIdx === train.schedule.length - 1) {
                    if (currentSec <= currentStation.sec + STOP_DURATION) {
                        isStopped = true; timeRemaining = 0;
                    } else return null; 
                } else {
                    const timePassedSinceArrival = currentSec - currentStation.sec;
                    if (timePassedSinceArrival <= STOP_DURATION) {
                        isStopped = true; overallProgress = currentStation.progress; timeRemaining = nextStation.sec - currentSec;
                    } else {
                        const segmentDuration = Math.max(1, nextStation.sec - (currentStation.sec + STOP_DURATION));
                        const timeMoving = currentSec - (currentStation.sec + STOP_DURATION);
                        const segmentProgress = Math.min(1, Math.max(0, timeMoving / segmentDuration));
                        overallProgress = currentStation.progress + (nextStation.progress - currentStation.progress) * segmentProgress;
                        timeRemaining = nextStation.sec - currentSec;
                    }
                }
                return { ...train, currentStation, nextStation, overallProgress, timeRemaining, isStopped, isWaiting: false };
            }).filter(t => t !== null);

            // 첫차 대기 포함 로직
            if (active.length === 0 && trainList.length > 0) {
                const firstTrainOfDay = trainList.reduce((prev, curr) => prev.schedule[0].sec < curr.schedule[0].sec ? prev : curr);
                if (currentSec >= 25 * 3600 || currentSec < firstTrainOfDay.schedule[0].sec) {
                    active.push({
                        ...firstTrainOfDay,
                        currentStation: firstTrainOfDay.schedule[0],
                        nextStation: firstTrainOfDay.schedule[1],
                        overallProgress: firstTrainOfDay.schedule[0].progress,
                        timeRemaining: firstTrainOfDay.schedule[0].sec - currentSec,
                        isStopped: true, isWaiting: true
                    });
                }
            }
            
            if (dirStr === 'up') active.sort((a, b) => a.overallProgress - b.overallProgress);
            else active.sort((a, b) => b.overallProgress - a.overallProgress);

            return active;
        };

        function render() {
            dom.clock.textContent = secondsToTime(currentSec);

            // 현재 화면 토글에 맞는 데이터 연산 (UI, 구불구불한 맵들 전용)
            let activeTrains = getActiveTrainDetails(parsedTrains, currentDirection);

            // 자동 선택 유지
            if (activeTrains.length > 0 && (!selectedTrainId || !activeTrains.find(t => t.id === selectedTrainId))) {
                selectedTrainId = activeTrains[0].id;
            } else if (activeTrains.length === 0) {
                selectedTrainId = null;
            }

            // 구불구불한 메인 좌표(Route, Map) 계산
            const renderedTrains = activeTrains.map(train => {
                let aRef, aLen;
                if (activeTab === 'route') { aRef = dom.routePath; aLen = routeLength; }
                else if (activeTab === 'map') { aRef = dom.mapPath; aLen = mapLength; }
                else { aRef = currentDirection === 'up' ? dom.linePathUp : dom.linePathDown; aLen = 1100; }
                
                let point = { x: 0, y: 0 }, angle = 0;
                if (aLen > 0 && aRef) {
                    const currentLen = aLen * train.overallProgress;
                    point = aRef.getPointAtLength(currentLen);
                    
                    let nextLen = currentDirection === 'up' ? currentLen - 1 : currentLen + 1;
                    if (nextLen < 0) nextLen = 0;
                    if (nextLen > aLen) nextLen = aLen;
                    
                    const nextPoint = aRef.getPointAtLength(nextLen);
                    angle = Math.atan2(nextPoint.y - point.y, nextPoint.x - point.x) * (180 / Math.PI);
                }
                return { ...train, point, angle };
            });

            const selectedData = renderedTrains.find(t => t.id === selectedTrainId);

            // UI 업데이트: 상단 버튼 리스트
            let btnHtml = renderedTrains.length === 0 ? `<span class="text-xs text-gray-400 font-medium py-1">현재 운행 데이터 없음 (운행 종료)</span>` : '';
            renderedTrains.forEach(t => {
                const isSel = t.id === selectedTrainId;
                btnHtml += `<button onclick="handleTrainClick('${t.id}')" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap transition-all ${isSel ? 'bg-[#0052FF] text-white shadow-md scale-105' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}">${t.id} ${t.isWaiting ? ' (대기중)' : ''}</button>`;
            });
            if(dom.trainList.innerHTML !== btnHtml) dom.trainList.innerHTML = btnHtml;

            // UI 업데이트: Static 정거장 (선택 됨/안됨)
            drawStaticStations();

            // UI 업데이트: SVG 열차 그리기
            if(activeTab === 'route') updateTrainsSVG(dom.routeTrains, renderedTrains);
            if(activeTab === 'map') updateTrainsSVG(dom.mapTrains, renderedTrains);
            
            // 신규: '노선(Line)' 탭일 경우 상하행을 별도로 구해서 한꺼번에 그리기
            if(activeTab === 'line') {
                const makeLineTrainData = (tList, directionStr) => {
                    let activeLineTrains = getActiveTrainDetails(tList, directionStr);
                    return activeLineTrains.map(train => {
                        const aRef = directionStr === 'up' ? dom.linePathUp : dom.linePathDown;
                        let point = { x: 0, y: 0 }, angle = 0;
                        if (aRef) {
                            const currentLen = 1100 * train.overallProgress;
                            point = aRef.getPointAtLength(currentLen);
                            let nextLen = directionStr === 'up' ? currentLen - 1 : currentLen + 1;
                            if (nextLen < 0) nextLen = 0;
                            if (nextLen > 1100) nextLen = 1100;
                            const nextPoint = aRef.getPointAtLength(nextLen);
                            angle = Math.atan2(nextPoint.y - point.y, nextPoint.x - point.x) * (180 / Math.PI);
                        }
                        return { ...train, point, angle };
                    });
                };
                
                updateTrainsSVG(dom.lineTrainsUp, makeLineTrainData(parsedTrainsUp, 'up'));
                updateTrainsSVG(dom.lineTrainsDown, makeLineTrainData(parsedTrainsDown, 'down'));
            }

            // UI 업데이트: Auto Scroll (노선 탭 제외)
            if (isAutoScroll && selectedData && !selectedStation && activeTab !== 'line') {
                dom.autoScrollBtn.classList.add('hidden');
                const vOff = (dom.scrollContainer.clientHeight - 150) / 2;
                dom.scrollContainer.scrollTo({ top: selectedData.point.y + 120 - vOff, behavior: 'auto' });
            } else {
                if (selectedData && !selectedStation && activeTab !== 'line') dom.autoScrollBtn.classList.remove('hidden');
                else dom.autoScrollBtn.classList.add('hidden');
            }

            // UI 업데이트: 플로팅 패널
            let panelHtml = '';
            if (selectedStation) {
                // 상하행 모두에서 선택된 역의 정보를 수집하고 최종 목적지(행)를 파악
                let upcomingAll = [];
                [parsedTrainsUp, parsedTrainsDown].forEach((tList) => {
                    tList.forEach(t => {
                        const stop = t.schedule.find(s => s.name === selectedStation);
                        if (stop) {
                            const destination = t.schedule[t.schedule.length - 1].name;
                            upcomingAll.push({ id: t.id, sec: stop.sec, time: stop.time, destination: destination });
                        }
                    });
                });
                
                // 시간순으로 정렬하여 가장 가까운 4대만 표시
                const upcoming = upcomingAll.filter(t => t.sec >= currentSec).sort((a, b) => a.sec - b.sec).slice(0, 4);

                panelHtml = `
                    <div class="bg-white/95 backdrop-blur-xl rounded-2xl shadow-[0_4px_30px_rgba(0,0,0,0.15)] border border-gray-100/80 p-4">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-lg font-extrabold text-gray-900 flex items-center gap-1.5">
                                ${selectedStation}역 <span class="text-xs font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-sm">전체 방면</span>
                            </h3>
                            <button onclick="handleStationClick(null)" class="p-1 text-gray-400 hover:text-gray-900 bg-gray-50 rounded-full">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                            </button>
                        </div>
                        <div class="flex flex-col gap-2 mb-3">
                            ${upcoming.length > 0 ? upcoming.map(t => `
                                <div class="flex justify-between items-center bg-gray-50 rounded-lg p-2.5 border border-gray-100">
                                    <div class="flex items-center gap-2">
                                        <span class="bg-[#0052FF]/10 text-[#0052FF] text-[10px] px-1.5 py-0.5 rounded font-bold">${t.id}</span>
                                        <span class="text-sm font-bold text-gray-900">${t.time.slice(0,5)} <span class="text-[10px] text-gray-500 font-medium ml-0.5">${t.destination}행</span></span>
                                    </div>
                                    <span class="text-xs font-bold text-[#0052FF]">${Math.ceil((t.sec - currentSec)/60)}분 후</span>
                                </div>
                            `).join('') : `<div class="py-4 text-center text-sm font-bold text-gray-400">금일 해당 역 열차 운행이 모두 종료되었습니다.</div>`}
                        </div>
                        <button onclick="openModal()" class="w-full flex items-center justify-center gap-1.5 bg-[#0052FF] text-white py-2.5 rounded-xl text-sm font-bold shadow-sm active:scale-95 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
                            전체 시간표 보기
                        </button>
                    </div>`;

                // 모달 내용 전체 방면으로 통합 갱신
                let fullTimetableAll = [];
                [parsedTrainsUp, parsedTrainsDown].forEach((tList) => {
                    tList.forEach(t => {
                        const stop = t.schedule.find(s => s.name === selectedStation);
                        if (stop) {
                            const destination = t.schedule[t.schedule.length - 1].name;
                            fullTimetableAll.push({ id: t.id, sec: stop.sec, time: stop.time, destination: destination });
                        }
                    });
                });
                const fullTimetable = fullTimetableAll.sort((a, b) => a.sec - b.sec);
                
                dom.modalTitle.textContent = `${selectedStation}역 시간표`;
                
                const typeStr = currentDayType === 'weekday' ? '평일' : (currentDayType === 'holiday' ? '공휴일' : '주말');
                dom.modalSubtitle.textContent = `대경선 ${typeStr} 전체 방면`;

                dom.modalContent.innerHTML = fullTimetable.map((t, idx) => {
                    const isPast = t.sec < currentSec;
                    const isNext = !isPast && (idx === 0 || fullTimetable[idx-1].sec < currentSec);
                    return `
                        <div class="flex justify-between items-center py-3.5 border-b border-gray-50 ${isNext ? 'bg-[#0052FF]/5 -mx-5 px-5 border-l-4 border-l-[#0052FF]' : ''}">
                            <div class="flex items-center gap-3">
                                <span class="w-12 text-[10px] font-bold text-center py-1 rounded-sm ${isPast ? 'bg-gray-100 text-gray-400' : 'bg-gray-100 text-gray-700'}">${t.id}</span>
                                <span class="text-base font-bold ${isPast ? 'text-gray-400 line-through decoration-gray-300' : isNext ? 'text-[#0052FF]' : 'text-gray-900'}">
                                    ${t.time.slice(0,5)} <span class="text-xs ${isPast ? 'text-gray-400 line-through' : 'text-gray-500'} ml-1 font-medium">${t.destination}행</span>
                                </span>
                            </div>
                            ${isNext ? `<span class="text-xs font-extrabold text-[#0052FF] animate-pulse">다음 열차</span>` : isPast ? `<span class="text-[10px] font-bold text-gray-300">출발됨</span>` : ''}
                        </div>`;
                }).join('');

            } else {
                panelHtml = `<div class="bg-white/95 backdrop-blur-xl rounded-2xl shadow-[0_4px_30px_rgba(0,0,0,0.1)] border border-gray-100/80 p-4 min-h-[72px] flex flex-col justify-center">`;
                if (!selectedData) {
                    panelHtml += `<div class="flex flex-col justify-center items-center py-1"><p class="text-sm font-bold text-gray-800">운행 종료 (현재 운행 중인 열차 없음)</p></div>`;
                } else {
                    panelHtml += `
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="flex items-baseline gap-1.5 mb-0.5">
                                    <span class="bg-[#0052FF] text-white text-[10px] px-1.5 py-0.5 rounded-sm font-bold">${selectedData.id}</span>
                                    <span class="text-[10px] font-semibold text-gray-500">${selectedData.isWaiting ? '첫차 대기중' : selectedData.isStopped ? '도착' : `(${selectedData.currentStation.name} 출발)`}</span>
                                </div>
                                <h2 class="text-lg font-extrabold text-gray-900 tracking-tight flex items-center gap-1">
                                    ${selectedData.isStopped || selectedData.isWaiting ? selectedData.currentStation.name : selectedData.nextStation.name}역 
                                    <span class="text-sm font-medium text-gray-500 font-normal">${selectedData.isWaiting ? '출발 예정' : selectedData.isStopped ? '정차중' : '도착 예정'}</span>
                                </h2>
                            </div>
                            ${!selectedData.isStopped && !selectedData.isWaiting ? `
                                <div class="text-right flex items-baseline gap-0.5">
                                    <p class="text-2xl font-black tracking-tighter" style="color: ${THEME_COLOR}">${Math.ceil(selectedData.timeRemaining / 60)}<span class="text-xs text-gray-900 ml-0.5 font-bold tracking-normal">분 전</span></p>
                                </div>` : ''}
                            ${selectedData.isWaiting ? `
                                <div class="text-right flex items-baseline gap-0.5">
                                    <p class="text-xl font-black tracking-tighter" style="color: ${THEME_COLOR}">${selectedData.currentStation.time.slice(0,5)}<span class="text-[10px] text-gray-500 ml-0.5 font-bold tracking-normal block">출발</span></p>
                                </div>` : ''}
                        </div>`;
                }
                panelHtml += `</div>`;
            }
            if(dom.floatingPanel.innerHTML !== panelHtml) dom.floatingPanel.innerHTML = panelHtml;
        }

        // --- 5. 앱 실행 --- //
        window.addEventListener('DOMContentLoaded', async () => {
            // 초기 시간 및 요일 설정
            const initialNow = new Date();
            currentDayType = getDayType(initialNow);
            dom.dayTypeDisplay.textContent = currentDayType === 'weekday' ? '평일' : (currentDayType === 'holiday' ? '공휴일' : '주말');
            
            // 💡 데이터 비동기 로드 완료 대기
            await loadTimetable();

            setTimeout(() => {
                routeLength = dom.routePath.getTotalLength();
                mapLength = dom.mapPath.getTotalLength();
                
                const tick = async () => {
                    const now = new Date();
                    
                    // 자정 경과 시 요일/공휴일 갱신 및 파일 다시 로드
                    const newDayType = getDayType(now);
                    if (currentDayType !== newDayType) {
                        currentDayType = newDayType;
                        dom.dayTypeDisplay.textContent = currentDayType === 'weekday' ? '평일' : (currentDayType === 'holiday' ? '공휴일' : '주말');
                        await loadTimetable();
                    }

                    let h = now.getHours();
                    if (h < 4) h += 24; 
                    currentSec = h * 3600 + now.getMinutes() * 60 + now.getSeconds();
                    render();
                };
                tick(); 
                setInterval(tick, 1000); 
            }, 50);
        });

    </script>
</body>
</html>
