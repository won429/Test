<!DOCTYPE html>
<html lang="ko">

    <!-- Tailwind CSS -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        
        /* 커스텀 스크롤바 숨김 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 애니메이션 설정 */
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
        .animate-ping { animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes pulse { 50% { opacity: .5; } }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes bounce { 
            0%, 100% { transform: translateY(-25%) translateX(-50%); animation-timing-function: cubic-bezier(0.8,0,1,1); } 
            50% { transform: none translateX(-50%); animation-timing-function: cubic-bezier(0,0,0.2,1); } 
        }
        .animate-bounce { animation: bounce 1s infinite; }
        
        /* 모달 슬라이드 애니메이션 */
        @keyframes slide-in-from-bottom { 0% { transform: translateY(100%); } 100% { transform: translateY(0); } }
        .animate-in { animation: slide-in-from-bottom 0.3s ease-out forwards; }
    </style>

<body class="bg-[#0a0a0c] flex justify-center h-[100dvh] overflow-hidden text-white">

                    <svg viewBox="0 0 400 1300" class="w-full h-[1300px] mt-4">

        const getDayType = (dateObj) => {
            const day = dateObj.getDay();
            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const ymd = `${yyyy}-${mm}-${dd}`;
            
            if (KOR_HOLIDAYS.includes(ymd)) return 'holiday';
            if (day === 0 || day === 6) return 'weekend';
            return 'weekday';
        };

        const timeToSeconds = (timeStr) => {
            if (!timeStr) return 0;
            let [h, m, s] = timeStr.split(':').map(Number);
            if (h < 4) h += 24; 
            return h * 3600 + m * 60 + s;
        };

        const secondsToTime = (totalSeconds) => {
            const h = Math.floor(totalSeconds / 3600) % 24; 
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = Math.floor(totalSeconds % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

                    fetch(targetDownUrl).catch(() => null)
                ]);

                const upCsv = (upRes && upRes.ok) ? await upRes.text() : (currentDayType === 'weekday' ? CSV_WEEKDAY_UP : '');
                const downCsv = (downRes && downRes.ok) ? await downRes.text() : '';

                const parseCsv = (csvStr) => {
                    if (!csvStr) return [];
                    const lines = csvStr.trim().split(/\r?\n/);
                    if (lines.length === 0) return [];
                    const headers = lines[0].split(',');
                    const trainIds = headers.slice(1);
                    const trains = trainIds.map(id => ({ id: id ? id.trim() : '', schedule: [] }));

                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const row = lines[i].split(',');
                        const stationName = row[0] ? row[0].trim() : '';
                        const stationData = STATIONS[stationName];
                        if (!stationData) continue;

                        for (let j = 1; j < row.length; j++) {
                            if (j - 1 >= trains.length) continue; 
                            const timeStr = row[j] ? row[j].trim() : '';
                            if (timeStr) {
                                trains[j-1].schedule.push({
                                    name: stationName,
                                    time: timeStr,
                                    sec: timeToSeconds(timeStr),
                                    progress: stationData.progress
                                });
                            }
                        }
                    }
                    trains.forEach(t => t.schedule.sort((a, b) => a.sec - b.sec));
                    return trains.filter(t => t.id && t.schedule.length >= 2);
                };

                parsedTrainsUp = parseCsv(upCsv);
                parsedTrainsDown = parseCsv(downCsv);
                parsedTrains = currentDirection === 'up' ? parsedTrainsUp : parsedTrainsDown;
                
                selectedTrainId = null;
                selectedStation = null;
            } catch (error) {
                console.error("시간표 데이터를 불러오는데 실패했습니다.", error);
            }
        };

        function drawStaticStations() {
            let lineHTML = '', routeHTML = '', mapHTML = '';
            for (const stationName in STATIONS) {
                const s = STATIONS[stationName];
                const isSel = selectedStation === stationName;
                
                const lineY = 100 + 1100 * s.progress;

                    <g transform="translate(200, ${lineY})" onclick="handleStationClick('${stationName}')" class="cursor-pointer">
                        <path d="M -80 0 L 80 0" stroke="#E5E8EB" stroke-width="2" stroke-dasharray="4" />
                        <rect x="-100" y="-15" width="200" height="30" fill="transparent" />

                        <text x="0" y="-12" text-anchor="middle" class="text-[12px] font-bold ${isSel ? 'text-[#0052FF]' : 'text-gray-700'}">${stationName}</text>

                    </g>
                `;

                let rPt = {x:0, y:0};
                if(routeLength > 0) rPt = dom.routePath.getPointAtLength(routeLength * s.progress);
                
                routeHTML += `
                    <g transform="translate(${rPt.x}, ${rPt.y})" onclick="handleStationClick('${stationName}')" class="cursor-pointer">
                        <circle r="20" fill="transparent" />

                        <text x="${s.xOff}" y="${s.yOff}" text-anchor="${s.align}" class="text-[13px] font-extrabold tracking-tight ${isSel ? 'text-[#0052FF]' : 'text-gray-800'}">${stationName}</text>
                        ${s.ktx ? `<text x="${s.xOff}" y="${s.yOff + 13}" text-anchor="${s.align}" fill="${THEME_COLOR}" class="text-[8px] font-black italic opacity-80">KTX</text>` : ''}
                    </g>
                `;

                let mPt = {x:0, y:0};
                if(mapLength > 0) mPt = dom.mapPath.getPointAtLength(mapLength * s.progress);
                mapHTML += `
                    <g transform="translate(${mPt.x}, ${mPt.y})" onclick="handleStationClick('${stationName}')" class="cursor-pointer">
                        <circle r="20" fill="transparent" />
                        <circle r="${isSel ? '8' : '6'}" fill="#FFFFFF" stroke="${isSel ? THEME_COLOR : '#A0ABC0'}" stroke-width="${isSel ? '4' : '3'}" class="transition-all" />
                        <rect x="-24" y="-30" width="48" height="20" rx="10" fill="white" opacity="0.95" class="shadow-sm" />
                        <text x="0" y="-16" text-anchor="middle" class="text-[11px] font-bold ${isSel ? 'text-[#0052FF]' : 'text-gray-700'}">${stationName}</text>
                    </g>

            }
            dom.lineStations.innerHTML = lineHTML;
            dom.routeStations.innerHTML = routeHTML;
            dom.mapStations.innerHTML = mapHTML;
        }

        function updateTrainsSVG(layer, trains) {
            const currentIds = trains.map(t => t.id);
            Array.from(layer.children).forEach(child => {
                if (!currentIds.includes(child.dataset.id)) child.remove();
            });

            trains.forEach(t => {
                let g = layer.querySelector(`g[data-id="${t.id}"]`);
                const isSelected = t.id === selectedTrainId;
                if (!g) {
                    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    g.dataset.id = t.id;
                    layer.appendChild(g);
                }
                
                g.setAttribute("transform", `translate(${t.point.x}, ${t.point.y}) rotate(${t.angle})`);
                
                const stateStr = `${isSelected}-${t.isStopped}-${t.isWaiting}`;
                if (g.dataset.state !== stateStr) {
                    g.innerHTML = `
                        ${isSelected && !t.isStopped && !t.isWaiting ? `<circle r="26" fill="${THEME_COLOR}" opacity="0.2" class="animate-ping" />` : ''}
                        ${isSelected && (t.isStopped || t.isWaiting) ? `<circle r="22" fill="${THEME_COLOR}" opacity="0.15" />` : ''}
                        <rect x="-16" y="-7" width="32" height="14" rx="3" fill="${isSelected ? THEME_COLOR : '#6B7280'}" stroke="#FFFFFF" stroke-width="2" class="shadow-lg" />
                        <rect x="-10" y="-4" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9" />
                        <rect x="-1" y="-4" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9" />
                        <rect x="8" y="-4" width="4" height="8" rx="1" fill="#FFFFFF" opacity="0.9" />
                        <path d="M 12 -7 L 16 -4 L 16 4 L 12 7 Z" fill="${isSelected ? THEME_COLOR : '#6B7280'}" />
                        <circle cx="15" cy="-3" r="1.5" fill="${isSelected ? '#FFE600' : '#FFFFFF'}" />
                        <circle cx="15" cy="3" r="1.5" fill="${isSelected ? '#FFE600' : '#FFFFFF'}" />
                        ${t.isWaiting ? `<text x="0" y="-18" text-anchor="middle" fill="${THEME_COLOR}" class="text-[10px] font-bold animate-pulse" transform="rotate(${-t.angle})">첫차 대기중</text>` : ''}
                    `;
                    g.dataset.state = stateStr;
                }
            });
        }

        const getActiveTrainDetails = (trainList, dirStr) => {
            let active = trainList.map(train => {
                const firstStop = train.schedule[0];
                const lastStop = train.schedule[train.schedule.length - 1];
                if (currentSec < firstStop.sec || currentSec > lastStop.sec + STOP_DURATION) return null;

                let currentIdx = 0;
                for (let i = 0; i < train.schedule.length; i++) {
                    if (currentSec >= train.schedule[i].sec) currentIdx = i; else break;
                }

                const currentStation = train.schedule[currentIdx];
                const nextStation = train.schedule[currentIdx + 1] || currentStation;
                let overallProgress = currentStation.progress, isStopped = false, timeRemaining = 0;

                if (currentIdx === train.schedule.length - 1) {
                    if (currentSec <= currentStation.sec + STOP_DURATION) {
                        isStopped = true; timeRemaining = 0;
                    } else return null; 
                } else {
                    const timePassedSinceArrival = currentSec - currentStation.sec;
                    if (timePassedSinceArrival <= STOP_DURATION) {
                        isStopped = true; overallProgress = currentStation.progress; timeRemaining = nextStation.sec - currentSec;
                    } else {
                        const segmentDuration = Math.max(1, nextStation.sec - (currentStation.sec + STOP_DURATION));
                        const timeMoving = currentSec - (currentStation.sec + STOP_DURATION);
                        const segmentProgress = Math.min(1, Math.max(0, timeMoving / segmentDuration));
                        overallProgress = currentStation.progress + (nextStation.progress - currentStation.progress) * segmentProgress;
                        timeRemaining = nextStation.sec - currentSec;
                    }
                }
                return { ...train, currentStation, nextStation, overallProgress, timeRemaining, isStopped, isWaiting: false };
            }).filter(t => t !== null);

            if (active.length === 0 && trainList.length > 0) {
                const firstTrainOfDay = trainList.reduce((prev, curr) => prev.schedule[0].sec < curr.schedule[0].sec ? prev : curr);
                if (currentSec >= 25 * 3600 || currentSec < firstTrainOfDay.schedule[0].sec) {
                    active.push({
                        ...firstTrainOfDay,
                        currentStation: firstTrainOfDay.schedule[0],
                        nextStation: firstTrainOfDay.schedule[1],
                        overallProgress: firstTrainOfDay.schedule[0].progress,
                        timeRemaining: firstTrainOfDay.schedule[0].sec - currentSec,
                        isStopped: true, isWaiting: true
                    });
                }
            }
            
            if (dirStr === 'up') active.sort((a, b) => a.overallProgress - b.overallProgress);
            else active.sort((a, b) => b.overallProgress - a.overallProgress);

            return active;
        };

        function render() {
            dom.clock.textContent = secondsToTime(currentSec);

            let activeTrains = getActiveTrainDetails(parsedTrains, currentDirection);

            if (activeTrains.length > 0 && (!selectedTrainId || !activeTrains.find(t => t.id === selectedTrainId))) {
                selectedTrainId = activeTrains[0].id;
            } else if (activeTrains.length === 0) {
                selectedTrainId = null;
            }

            const renderedTrains = activeTrains.map(train => {
                let aRef, aLen;
                if (activeTab === 'route') { aRef = dom.routePath; aLen = routeLength; }
                else if (activeTab === 'map') { aRef = dom.mapPath; aLen = mapLength; }
                else { aRef = currentDirection === 'up' ? dom.linePathUp : dom.linePathDown; aLen = 1100; }
                
                let point = { x: 0, y: 0 }, angle = 0;
                if (aLen > 0 && aRef) {
                    const currentLen = aLen * train.overallProgress;
                    point = aRef.getPointAtLength(currentLen);
                    
                    let nextLen = currentDirection === 'up' ? currentLen - 1 : currentLen + 1;
                    if (nextLen < 0) nextLen = 0;
                    if (nextLen > aLen) nextLen = aLen;
                    
                    const nextPoint = aRef.getPointAtLength(nextLen);
                    angle = Math.atan2(nextPoint.y - point.y, nextPoint.x - point.x) * (180 / Math.PI);
                }
                return { ...train, point, angle };
            });

            const selectedData = renderedTrains.find(t => t.id === selectedTrainId);

            // 상단 버튼 리스트 (다크 테마)
            let btnHtml = renderedTrains.length === 0 ? `<span class="text-xs text-gray-400 font-medium py-1">현재 운행 데이터 없음 (운행 종료)</span>` : '';
            renderedTrains.forEach(t => {
                const isSel = t.id === selectedTrainId;
                btnHtml += `<button onclick="handleTrainClick('${t.id}')" class="flex-shrink-0 px-4 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap transition-all ${isSel ? 'bg-[#0052FF] text-white shadow-[0_0_15px_rgba(0,82,255,0.4)] scale-105' : 'bg-white/5 text-gray-400 border border-white/5 hover:bg-white/10'}">${t.id} ${t.isWaiting ? ' (대기중)' : ''}</button>`;
            });
            if(dom.trainList.innerHTML !== btnHtml) dom.trainList.innerHTML = btnHtml;

            drawStaticStations();

            if(activeTab === 'route') updateTrainsSVG(dom.routeTrains, renderedTrains);
            if(activeTab === 'map') updateTrainsSVG(dom.mapTrains, renderedTrains);
            
            if(activeTab === 'line') {
                const makeLineTrainData = (tList, directionStr) => {
                    let activeLineTrains = getActiveTrainDetails(tList, directionStr);
                    return activeLineTrains.map(train => {
                        const aRef = directionStr === 'up' ? dom.linePathUp : dom.linePathDown;
                        let point = { x: 0, y: 0 }, angle = 0;
                        if (aRef) {
                            const currentLen = 1100 * train.overallProgress;
                            point = aRef.getPointAtLength(currentLen);
                            let nextLen = directionStr === 'up' ? currentLen - 1 : currentLen + 1;
                            if (nextLen < 0) nextLen = 0;
                            if (nextLen > 1100) nextLen = 1100;
                            const nextPoint = aRef.getPointAtLength(nextLen);
                            angle = Math.atan2(nextPoint.y - point.y, nextPoint.x - point.x) * (180 / Math.PI);
                        }
                        return { ...train, point, angle };
                    });
                };
                
                updateTrainsSVG(dom.lineTrainsUp, makeLineTrainData(parsedTrainsUp, 'up'));
                updateTrainsSVG(dom.lineTrainsDown, makeLineTrainData(parsedTrainsDown, 'down'));
            }

            if (isAutoScroll && selectedData && !selectedStation && activeTab !== 'line') {
                dom.autoScrollBtn.classList.add('hidden');
                const vOff = (dom.scrollContainer.clientHeight - 150) / 2;
                dom.scrollContainer.scrollTo({ top: selectedData.point.y + 120 - vOff, behavior: 'auto' });
            } else {
                if (selectedData && !selectedStation && activeTab !== 'line') dom.autoScrollBtn.classList.remove('hidden');
                else dom.autoScrollBtn.classList.add('hidden');
            }

            // 플로팅 패널 및 모달 (상하행 토글 적용)
            let panelHtml = '';
            if (selectedStation) {
                // 현재 토글 상태(stationDetailDirection)에 맞춰 해당 방면 배열만 사용
                let targetTrains = stationDetailDirection === 'up' ? parsedTrainsUp : parsedTrainsDown;
                let upcomingAll = [];
                
                targetTrains.forEach(t => {
                    const stop = t.schedule.find(s => s.name === selectedStation);
                    if (stop) {
                        const destination = t.schedule[t.schedule.length - 1].name;
                        upcomingAll.push({ id: t.id, sec: stop.sec, time: stop.time, destination: destination });
                    }
                });
                
                const upcoming = upcomingAll.filter(t => t.sec >= currentSec).sort((a, b) => a.sec - b.sec).slice(0, 4);

                panelHtml = `
                    <div class="bg-[#121215]/95 backdrop-blur-xl rounded-[1.5rem] shadow-[0_10px_40px_rgba(0,0,0,0.5)] border border-white/5 p-5">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex flex-col gap-2">
                                <h3 class="text-xl font-extrabold text-white flex items-center gap-2">
                                    ${selectedStation}역
                                </h3>
                                <div class="flex bg-white/5 rounded-md p-0.5 w-max border border-white/10">
                                    <button onclick="setStationDetailDirection('up'); event.stopPropagation();" class="${stationDetailDirection === 'up' ? 'bg-[#0052FF] text-white shadow-sm' : 'text-gray-500 hover:text-gray-300'} text-[10px] font-bold px-3 py-1 rounded transition-all">상행(구미)</button>
                                    <button onclick="setStationDetailDirection('down'); event.stopPropagation();" class="${stationDetailDirection === 'down' ? 'bg-[#0052FF] text-white shadow-sm' : 'text-gray-500 hover:text-gray-300'} text-[10px] font-bold px-3 py-1 rounded transition-all">하행(경산)</button>
                                </div>
                            </div>
                            <button onclick="handleStationClick(null)" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-white bg-white/5 rounded-full transition-colors mt-1">
                                <i class="fa-solid fa-xmark text-sm"></i>
                            </button>
                        </div>
                        <div class="flex flex-col gap-2 mb-4">
                            ${upcoming.length > 0 ? upcoming.map(t => `
                                <div class="flex justify-between items-center bg-white/5 rounded-xl p-3 border border-white/5">
                                    <div class="flex items-center gap-2.5">
                                        <span class="bg-[#0052FF]/20 text-[#0052FF] text-[10px] px-2 py-0.5 rounded font-bold">${t.id}</span>
                                        <span class="text-[15px] font-bold text-white">${t.time.slice(0,5)} <span class="text-[11px] text-gray-400 font-medium ml-1">${t.destination}행</span></span>
                                    </div>
                                    <span class="text-sm font-extrabold text-[#0052FF]">${Math.ceil((t.sec - currentSec)/60)}분 후</span>
                                </div>
                            `).join('') : `<div class="py-5 text-center text-[13px] font-bold text-gray-500">해당 방면 운행이 모두 종료되었습니다.</div>`}
                        </div>
                        <button onclick="openModal()" class="w-full flex items-center justify-center gap-2 bg-[#0052FF] hover:bg-blue-600 text-white py-3.5 rounded-xl text-[13px] font-bold shadow-[0_4px_15px_rgba(0,82,255,0.3)] active:scale-95 transition-all">
                            <i class="fa-regular fa-calendar-days text-base"></i>
                            전체 시간표 보기
                        </button>
                    </div>`;

                // 모달 내용 (해당 방면에 맞춰서 렌더링)
                const fullTimetable = upcomingAll.sort((a, b) => a.sec - b.sec);
                
                dom.modalTitle.textContent = `${selectedStation}역 시간표`;
                
                dom.modalSubtitle.innerHTML = `
                    <div class="flex bg-white/5 rounded-lg p-0.5 w-max border border-white/10 mt-1">
                        <button onclick="setStationDetailDirection('up'); event.stopPropagation();" class="${stationDetailDirection === 'up' ? 'bg-[#0052FF] text-white shadow-sm' : 'text-gray-500 hover:text-gray-300'} text-xs font-bold px-4 py-1.5 rounded-md transition-all">상행 (구미 방면)</button>
                        <button onclick="setStationDetailDirection('down'); event.stopPropagation();" class="${stationDetailDirection === 'down' ? 'bg-[#0052FF] text-white shadow-sm' : 'text-gray-500 hover:text-gray-300'} text-xs font-bold px-4 py-1.5 rounded-md transition-all">하행 (경산 방면)</button>
                    </div>
                `;

                dom.modalContent.innerHTML = fullTimetable.map((t, idx) => {
                    const isPast = t.sec < currentSec;
                    const isNext = !isPast && (idx === 0 || fullTimetable[idx-1].sec < currentSec);
                    return `
                        <div class="flex justify-between items-center py-4 border-b border-white/5 ${isNext ? 'bg-[#0052FF]/10 -mx-5 px-5 border-l-[3px] border-l-[#0052FF]' : ''}">
                            <div class="flex items-center gap-3">
                                <span class="w-12 text-[11px] font-bold text-center py-1 rounded-sm ${isPast ? 'bg-white/5 text-gray-600' : 'bg-white/10 text-gray-300'}">${t.id}</span>
                                <span class="text-base font-bold tracking-wide ${isPast ? 'text-gray-600 line-through decoration-gray-700' : isNext ? 'text-[#0052FF]' : 'text-gray-100'}">
                                    ${t.time.slice(0,5)} <span class="text-xs ${isPast ? 'text-gray-600 line-through' : 'text-gray-400'} ml-1 font-medium">${t.destination}행</span>
                                </span>
                            </div>
                            ${isNext ? `<span class="text-[11px] font-extrabold text-[#0052FF] animate-pulse">다음 열차</span>` : isPast ? `<span class="text-[10px] font-bold text-gray-700">출발됨</span>` : ''}
                        </div>`;
                }).join('');

            } else {
                panelHtml = `<div class="bg-[#121215]/95 backdrop-blur-xl rounded-[1.5rem] shadow-[0_10px_40px_rgba(0,0,0,0.5)] border border-white/5 p-5 min-h-[72px] flex flex-col justify-center">`;
                if (!selectedData) {
                    panelHtml += `<div class="flex flex-col justify-center items-center py-2"><p class="text-[13px] font-bold text-gray-400">운행 종료 (현재 운행 중인 열차 없음)</p></div>`;
                } else {
                    panelHtml += `
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="flex items-baseline gap-1.5 mb-1">
                                    <span class="bg-[#0052FF] text-white text-[10px] px-2 py-0.5 rounded-sm font-bold shadow-[0_0_8px_rgba(0,82,255,0.3)]">${selectedData.id}</span>
                                    <span class="text-[11px] font-semibold text-gray-400">${selectedData.isWaiting ? '첫차 대기중' : selectedData.isStopped ? '도착' : `(${selectedData.currentStation.name} 출발)`}</span>
                                </div>
                                <h2 class="text-xl font-extrabold text-white tracking-tight flex items-center gap-1.5">
                                    ${selectedData.isStopped || selectedData.isWaiting ? selectedData.currentStation.name : selectedData.nextStation.name}역 
                                    <span class="text-[13px] font-medium text-gray-400 font-normal">${selectedData.isWaiting ? '출발 예정' : selectedData.isStopped ? '정차중' : '도착 예정'}</span>
                                </h2>
                            </div>
                            ${!selectedData.isStopped && !selectedData.isWaiting ? `
                                <div class="text-right flex items-baseline gap-0.5">
                                    <p class="text-[26px] font-black tracking-tighter" style="color: ${THEME_COLOR}">${Math.ceil(selectedData.timeRemaining / 60)}<span class="text-[11px] text-gray-400 ml-0.5 font-bold tracking-normal">분 전</span></p>
                                </div>` : ''}
                            ${selectedData.isWaiting ? `
                                <div class="text-right flex items-baseline gap-0.5">
                                    <p class="text-[22px] font-black tracking-tighter" style="color: ${THEME_COLOR}">${selectedData.currentStation.time.slice(0,5)}<span class="text-[10px] text-gray-400 ml-1 font-bold tracking-normal block">출발</span></p>
                                </div>` : ''}
                        </div>`;
                }
                panelHtml += `</div>`;
            }
            if(dom.floatingPanel.innerHTML !== panelHtml) dom.floatingPanel.innerHTML = panelHtml;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const initialNow = new Date();
            currentDayType = getDayType(initialNow);
            dom.dayTypeDisplay.textContent = currentDayType === 'weekday' ? '평일' : (currentDayType === 'holiday' ? '공휴일' : '주말');
            
            await loadTimetable();

            setTimeout(() => {
                routeLength = dom.routePath.getTotalLength();
                mapLength = dom.mapPath.getTotalLength();
                
                const tick = async () => {
                    const now = new Date();
                    
                    const newDayType = getDayType(now);
                    if (currentDayType !== newDayType) {
                        currentDayType = newDayType;
                        dom.dayTypeDisplay.textContent = currentDayType === 'weekday' ? '평일' : (currentDayType === 'holiday' ? '공휴일' : '주말');
                        await loadTimetable();
                    }

                    let h = now.getHours();
                    if (h < 4) h += 24; 
                    currentSec = h * 3600 + now.getMinutes() * 60 + now.getSeconds();
                    render();
                };
                tick(); 
                setInterval(tick, 1000); 
            }, 50);
        });

    </script>
</body>
</html>
